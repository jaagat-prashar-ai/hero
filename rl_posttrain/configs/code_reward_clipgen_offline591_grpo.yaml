# One-epoch GRPO run over the complete sealed GT-only Full1050-v1 reward
# corpus: 591 published functions from 25 offline shards. Each training
# prompt samples 12 live rollouts and verifies the argmax with the same
# frozen per-clip rubric before allowing a GRPO update.
name: alpamayo-rl-clipgen-offline591-grpo
model_identifier: other.training.alpamayo15.default.v1
ignore_idle_reaper: true

workload_variant_config:
  workload_type: "generic"
  entrypoint_fn: rl_posttrain.training.run.rl_local_test_loop
  entrypoint_fn_config:
    workspace_dir: "/mnt/work/tmp/alpamayo_rl_clipgen_offline591"
    alpamayo_model: "nvidia/Alpamayo-1.5-10B"
    reward_mode: "code"
    clipgen_only_clips: true
    clipgen_chunks_only: true
    clipgen_run_s3_prefixes:
      - "code_as_a_reward/clipgen/offline_rewards/full1050-v1-shard0"
      - "code_as_a_reward/clipgen/offline_rewards/full1050-v1-shard1"
      - "code_as_a_reward/clipgen/offline_rewards/full1050-v1-shard2"
      - "code_as_a_reward/clipgen/offline_rewards/full1050-v1-shard3"
      - "code_as_a_reward/clipgen/offline_rewards/full1050-v1-shard4"
      - "code_as_a_reward/clipgen/offline_rewards/full1050-v1-shard5"
      - "code_as_a_reward/clipgen/offline_rewards/full1050-v1-shard6"
      - "code_as_a_reward/clipgen/offline_rewards/full1050-v1-shard7"
      - "code_as_a_reward/clipgen/offline_rewards/full1050-v1-shard8"
      - "code_as_a_reward/clipgen/offline_rewards/full1050-v1-shard9"
      - "code_as_a_reward/clipgen/offline_rewards/full1050-v1-shard10"
      - "code_as_a_reward/clipgen/offline_rewards/full1050-v1-shard11"
      - "code_as_a_reward/clipgen/offline_rewards/full1050-v1-shard12"
      - "code_as_a_reward/clipgen/offline_rewards/full1050-v1-shard13"
      - "code_as_a_reward/clipgen/offline_rewards/full1050-v1-shard14"
      - "code_as_a_reward/clipgen/offline_rewards/full1050-v1-shard15"
      - "code_as_a_reward/clipgen/offline_rewards/full1050-v1-shard16"
      - "code_as_a_reward/clipgen/offline_rewards/full1050-v1-shard17"
      - "code_as_a_reward/clipgen/offline_rewards/full1050-v1-shard18"
      - "code_as_a_reward/clipgen/offline_rewards/full1050-v1-shard19"
      - "code_as_a_reward/clipgen/offline_rewards/full1050-v1-shard20"
      - "code_as_a_reward/clipgen/offline_rewards/full1050-v1-shard21"
      - "code_as_a_reward/clipgen/offline_rewards/full1050-v1-shard22"
      - "code_as_a_reward/clipgen/offline_rewards/full1050-v1-shard23"
      - "code_as_a_reward/clipgen/offline_rewards/full1050-v1-shard24"
    clipgen_s3_bucket: "research-datasets-chicago"
    clipgen_min_corpus_size: 591
    reasoning_dense_chunks: 2000
    pai_s3_cache_prefix: "pai_warm_cache/ood_clipgen_offline591"
    ckpt_s3_prefix: "alpamayo_rl/checkpoints/clipgen_offline591_grpo"
    dp_shard_size: 4
    train_epoch: 1
    wandb_project: "alpamayo-rl"
    wandb_experiment: "reasoning_vla_clipgen_offline591_grpo"
    wandb_entity: "research"

cluster_resources:
  gpu_machine_type: a100.8
  num_gpus: 8
  customer_resource: research
  preemptible: never
  allowed_regions: [us-chicago-1]
  requeue_if_preempted: true

runtime_environment:
  setup_timeout_seconds: 28800
  required_environment_variables: [HF_TOKEN, WANDB_API_KEY]
  constant_environment_variables:
    AWS_REQUEST_CHECKSUM_CALCULATION: when_required
    AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    AWS_ENDPOINT_URL_S3: "https://idskhu5vqvtl.compat.objectstorage.us-chicago-1.oraclecloud.com"
    AWS_DEFAULT_REGION: us-chicago-1
    CODE_REWARD_VERIFY_TOP_K: "1"
    CODE_REWARD_DEBUG_DUMP_ROLLOUTS: "1"
    CODE_REWARD_DEBUG_DUMP_RUN_ID: "clipgen-offline591-grpo"
  code_assets:
    root_directory: .
    pip_requirements_path: rl_posttrain/requirements.txt
    regex_excludes:
      - "^/mnist/"
      - "^/research-core/"
      - "^/docker/"
      - "^/lockfiles/"
      - "^/build_wds/"
      - "^/masking/"
      - "^/simlingo/"
      - "^/pref_pairs/results/"
      - "^/autovla/"
      - "^/third_party/alpamayo1\\.5/"
      - "^/perplexity/"
      - "/\\.venv/"
      - "^/jspace/"
      - "^/\\.git/"
