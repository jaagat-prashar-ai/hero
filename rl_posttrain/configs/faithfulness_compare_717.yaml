    clipgen_s3_bucket: "research-datasets-chicago"
    clipgen_min_corpus_size: 717
    reasoning_dense_chunks: 2000
    pai_s3_cache_prefix: "pai_warm_cache/ood_clipgen_faithfulness717"
    pai_s3_cache_fallback_prefixes:
      - "pai_warm_cache/ood_clipgen_offline591"
      - "pai_warm_cache/ood_clipgen_full1050"
    model_s3_cache_prefix: "alpamayo_rl/model_cache/alpamayo15_converted"
    ckpt_s3_prefix: "alpamayo_rl/checkpoints/faithfulness_clipgen717"
    dp_shard_size: 4
    train_epoch: 1
    validation_enable: true
    validation_freq: 25
    validation_n_generation: 6
    wandb_project: "alpamayo-rl"
    wandb_experiment: "faithfulness_clipgen717"
    wandb_entity: "research"

cluster_resources:
  gpu_machine_type: a100.8
  num_gpus: 8
  customer_resource: research
  preemptible: never
  allowed_regions: [us-chicago-1]
  requeue_if_preempted: true

runtime_environment:
  setup_timeout_seconds: 28800
  required_environment_variables: [HF_TOKEN, WANDB_API_KEY, OPENAI_API_KEY]
  constant_environment_variables:
    AWS_REQUEST_CHECKSUM_CALCULATION: when_required
    AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    AWS_ENDPOINT_URL_S3: "https://idskhu5vqvtl.compat.objectstorage.us-chicago-1.oraclecloud.com"
    AWS_DEFAULT_REGION: us-chicago-1
    FAITHFULNESS_VAL_FRACTION: "0.15"
    FAITHFULNESS_VAL_SEED: "20260825"
    LLM_JUDGE_MODEL: "gpt-4o"
    CODE_REWARD_DISABLE_CLIPGEN: "0"
    CODE_REWARD_VERIFY_TOP_K: "1"
    CODE_REWARD_DEBUG_DUMP_ROLLOUTS: "1"
    CODE_REWARD_DEBUG_DUMP_RUN_ID: "faithfulness-clipgen717"
    CODE_REWARD_WANDB_IMAGES: "1"
    CODE_REWARD_WANDB_IMAGES_EVERY: "1"
    LLM_JUDGE_WANDB_IMAGES: "1"
    LLM_JUDGE_WANDB_IMAGES_EVERY: "1"
  code_assets:
    root_directory: .
    pip_requirements_path: rl_posttrain/requirements.txt
    regex_excludes:
      - "^/mnist/"
      - "^/research-core/"
      - "^/docker/"
      - "^/lockfiles/"
      - "^/build_wds/"
      - "^/masking/"
      - "^/simlingo/"
      - "^/pref_pairs/results/"
      - "^/autovla/"
      - "^/third_party/alpamayo1\\.5/"
      - "^/perplexity/"
      - "/\\.venv/"
      - "^/jspace/"
      - "^/\\.git/"
