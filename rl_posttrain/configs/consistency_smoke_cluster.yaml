# CoC-action consistency reward SMOKE TEST (2026-08-25): 16 reasoning clips,
# 2 epochs -- just enough GRPO steps to prove the new reward path end to end
# (Lingo-Judge grading + r_consistency from the vendored recipe's
# coc_consistency_reward) before committing a full dense-100 run to it.
#
# What to verify in W&B before launching consistency_full_cluster.yaml:
#   * `consistency` panel exists and its step-~0 mean is a plausible SFT
#     baseline (paper reports 0.62 for the un-post-trained checkpoint --
#     this early-step mean IS the no-RL baseline measurement, since rollouts
#     come from the frozen initial policy).
#   * `consistency_unparseable` well below 1.0 (a ~1.0 rate means the CoC
#     parser's patterns don't match real Alpamayo traces -- fix patterns,
#     don't train against a parse-failure constant).
#   * reasoning_score / traj_L2 / comfort panels behave like prior
#     reasoning-mode runs; reward not pinned at a constant.
name: alpamayo-rl-consistency-smoke
model_identifier: other.training.alpamayo15.default.v1
ignore_idle_reaper: true
workload_variant_config:
  workload_type: "generic"
  entrypoint_fn: rl_posttrain.training.run.rl_local_test_loop
  entrypoint_fn_config:
    # SAME persistent root as the other RL jobs: venv + converted model are
    # reused on a warm node; the 16-clip dataset lands in its own
    # parameter-stamped subdir (PAI_Reasoning_mini16/).
    workspace_dir: "/mnt/work/tmp/alpamayo_rl_job"

    alpamayo_model: "nvidia/Alpamayo-1.5-10B"

    reward_mode: "consistency"

    num_reasoning_clips: 16

    dp_shard_size: 4
    train_epoch: 2

    wandb_project: "alpamayo-rl"
    wandb_experiment: "reasoning_vla_consistency_smoke"
    wandb_entity: "research"

cluster_resources:
  gpu_machine_type: a100.8
  num_gpus: 8
  customer_resource: research
  # Smoke test is short and restartable; preemptible keeps queue time low.
  preemptible: always
  allowed_regions:
    - us-chicago-1
  requeue_if_preempted: true

runtime_environment:
  # Heavy bootstrapped-venv install (torch/vllm/flash-attn) on a cold node.
  setup_timeout_seconds: 7200

  required_environment_variables:
    - HF_TOKEN
    - WANDB_API_KEY

  constant_environment_variables:
    AWS_REQUEST_CHECKSUM_CALCULATION: when_required
    AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    AWS_ENDPOINT_URL_S3: "https://idskhu5vqvtl.compat.objectstorage.us-chicago-1.oraclecloud.com"
    AWS_DEFAULT_REGION: us-chicago-1

  code_assets:
    root_directory: .
    pip_requirements_path: rl_posttrain/requirements.txt
    regex_excludes:
      - "^/mnist/"
      - "^/research-core/"
      - "^/docker/"
      - "^/lockfiles/"
      - "^/build_wds/"
      - "^/masking/"
      - "^/pref_pairs/results/"
      - "^/autovla/"
      - "^/third_party/alpamayo1\\.5/"
      - "^/perplexity/"
      - "/\\.venv/"
      - "^/jspace/"
      - "^/\\.git/"
