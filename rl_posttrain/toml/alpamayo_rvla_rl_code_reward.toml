# Code-reward runs' own TOML (2026-08-02). Derived verbatim from
# alpamayo_rvla_rl_llm_judge.toml -- which n3sxdq shared with the judge
# experiments -- with exactly four changes, all from the n3sxdq post-mortem
# (entropy collapse -0.73/100 steps after step ~150, grad norm doubling with
# spikes to 25, reward slope exactly 0.000 after step 100):
#   1. kl_beta = 1e-3 (was 0.0): anchors the policy to the reference model.
#      n3sxdq trained with NO reference anchor at all and drifted freely in
#      its back half. Loads the ref model + one extra logit forward per step
#      (recipe base_trainer swaps reference_state_dict when kl_beta != 0).
#   2. cosine LR decay to 10% + 3% warmup (was flat 2e-6, zero warmup):
#      optm_decay_type/optm_min_lr_factor/optm_warmup_steps.
#   3. comfort_weight = 0.05 (was 0.0): deliberate, small. n3sxdq logged
#      comfort every step but weighted it zero; its comfort penalty worsened
#      monotonically (-0.06 -> -0.11) with nothing pushing back.
#   4. this header.
# Placeholder paths below (output_dir, model_name_or_path) are patched into
# a scratch copy by rl_posttrain/training/run.py at job time, never edited
# here. The judge TOML stays untouched so running judge experiments keep
# their exact config.

redis = "12800"

[train]
resume = false
epoch = 30
output_dir = "/path/to/alpamayo_cosmos_rl_job/outputs"
epsilon = 1e-6
optm_name = "AdamW"
optm_lr = 2e-6
optm_impl = "fused"
optm_weight_decay = 0.01
optm_betas = [0.9, 0.999]
# Warmup-stable-decay schedule (cosmos-rl warmup_stable_decay LambdaLR).
# optm_warmup_steps as a float in [0,1] = fraction of total steps; decay is
# cosine down to optm_min_lr_factor * optm_lr over all post-warmup steps.
optm_warmup_steps = 0.03
optm_decay_type = "cosine"
optm_min_lr_factor = 0.1
optm_grad_norm_clip = 1.0
async_tp_enabled = false
compile = false
param_dtype = "bfloat16"
fsdp_reduce_dtype = "float32"
fsdp_offload = false
fsdp_reshard_after_forward = "default"
train_batch_per_replica = 48
sync_weight_interval = 2
validation_step = 50
validation_batch_per_replica = 4
non_text = true

[validation]
enable = false
# Validation frequency in training steps.
freq = 50
# Validation batch size per rollout replica (defaults to rollout.batch_size if omitted).
batch_size = 4
temperature = 0.6
n_generation = 6


[rollout]
backend = "reasoning_vla_vllm_rollout"
gpu_memory_utilization = 0.8
enable_chunked_prefill = false
n_generation = 12
batch_size = 2
quantization = "none"
seed = 42

[rollout.sampling_config]
temperature = 0.6
top_p = 0.98
repetition_penalty = 1

[policy]
# ReasoningVLA HF checkpoint directory (must include ReasoningVLAConfig)
model_name_or_path = "/path/to/converted_alpamayo_model"
model_max_length = 4096
model_gradient_checkpointing = true

[logging]
logger = ['console', 'wandb']
project_name = "Alpamayo_RL"
experiment_name = "ReasoningVLA_Post_Training"


[train.train_policy]
type = "grpo"
trainer_type = "reasoning_vla_grpo"
# Canary grq1cf (2026-07-22) showed why false is a trap here: with a tiny
# clip set and fixed ordering, each step slot sees the same clips every
# epoch, so metrics carry a hard period-N cycle (traj_L2 oscillating 1.3 <->
# 7.8) and gradient batches stay clip-correlated across the whole run.
dataloader_shuffle = true
dataset.split = "train"
# Enable rank-based dispatch (mesh-rank sharding) so each replica consumes a stable shard.
data_dispatch_as_rank_in_mesh = false
temperature = 1.0
epsilon_low = 0.2
epsilon_high = 0.28
lower_bound_ratio = 10.0
# 1e-3, not 0.0: n3sxdq ran unanchored (kl_beta = 0 skips loading the
# reference model entirely) and drifted after step ~150. Small coefficient:
# enough to bound the drift, cheap enough not to fight the reward.
kl_beta = 1e-3
mu_iterations = 1
mini_batch = 1
min_filter_prefix_tokens = 1
allowed_outdated_steps = 50
# Hand each prompt's full rollout group to the reward fn in ONE call so the
# judge's API latency can be hidden behind a thread pool
# (aggregated_reward_llm_judge.compute_reward_batch). The default per-rollout
# serial loop paid 12 x (judge latency) per group -- slow enough to starve
# train batches past cosmos-rl's 10-min NCCL watchdog on canary
# alpamayo-rl-llm-judge-canary-u0j67p (2026-07-22).
group_reward_calculation = true

[train.ckpt]
enable_checkpoint = true
# 15, not 50: code-reward runs estimate ~45 total steps and actually finish
# at 32-35 (GRPO dynamic sampling discards all-same-reward groups, so the
# dataloader exhausts before the estimate) -- with save_freq=50 neither
# a1npli nor vtx3ys ever saved a single checkpoint.
save_freq = 15
save_mode = "async"
# 1, not 10: checkpoints are 60 GB and the node's 992 GB root disk already
# carries the ~570 GB dataset, so 10 local checkpoints can never exist --
# kubelet evicts the pod at 85% used, which rovn5p hit at the THIRD save
# (and llm-judge-full runs hit around step ~148, the "reaper" crash loop).
# Durability lives in S3 via run.py's _CheckpointUploader, which deletes
# each tensor file locally after upload; max_keep=1 is the in-framework
# backstop that prunes whole step dirs if the uploader ever falls behind.
max_keep = 1

[rollout.parallelism]
n_init_replicas = 1
tp_size = 1
cp_size = 1
dp_shard_size = 1
pp_size = 1
dp_replicate_size = 1

[policy.parallelism]
n_init_replicas = 1
tp_size = 1
cp_size = 1
dp_shard_size = 4
pp_size = 1
dp_replicate_size = 1


[custom.alpamayo]
idx_rng_enable = false
idx_rng_seed = 1234
idx_rng_debug = false


[custom.alpamayo.reward]
traj_l2_weight = 0.2
# 0.05, not 0.0 (2026-08-02): the judge TOML weighted comfort zero, so
# n3sxdq's comfort panel was purely decorative while the penalty worsened
# monotonically over the run. Small deliberate weight; see the TOML header.
comfort_weight = 0.05
reasoning_weight = 0.3

[custom.alpamayo.prefetch]

# Prefetch cache size; <= 0 disables node-prefetch (legacy synchronous dataset fetch path). please set this to be train_batch_per_replica * replica per node.
capacity = 16

# Unix socket directory (node-local). Default is /tmp.
# socket_dir = "/tmp"

num_workers = 5
# Log verbosity for node prefetch server/client.
# One of: "off" | "error" | "warn" | "info" | "debug" | "trace"
# - "trace" is very verbose (includes client RPC payload/resp).
log_level = "info"

# Print per-request detailed logs (cache hit/miss, dataset fetch, per-role shm put, latency).
log_request_details = false
