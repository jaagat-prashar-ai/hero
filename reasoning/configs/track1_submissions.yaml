# Track 1 (CoC generation) submission fleet: 6 rollouts per test event
# (reasoning/ood_reasoning_test.parquet, 214 clips / 284 events) for every
# post-trained RL checkpoint + the base SFT reference, one arm per GPU rank
# (see reasoning/run_track1_submissions.py).
#
# num_gpus: 8 -> 8 replicas via RANK/WORLD_SIZE (perplexity/configs/
# cluster.yaml's proven pattern); ranks 0-6 own the 7 arms below, rank 7
# exits immediately. workload_type MUST be "training" -- "generic" reserves
# no GPU (ood_eval/configs/full.yaml's hard-learned note).
#
# Do NOT launch before track1_smoke.yaml has passed end-to-end (conversion
# path + weight overlay + generation throughput are all unproven).
name: track1-submissions
model_identifier: other.training.alpamayo15.default.v1
ignore_idle_reaper: true

workload_variant_config:
  workload_type: "training"
  training_fn: reasoning.run_track1_submissions.track1_loop
  training_fn_config:
    group_size: 6
    s3_bucket: "research-datasets-chicago"
    out_s3_prefix: "alpamayo_rl/track1_submissions/fleet1"
    work_dir: "/mnt/work/tmp/track1"
    venv_dir: "/mnt/work/tmp/alpamayo15_venv"

    arms:
      # Base SFT reference (the model every RL run below started from).
      - name: base_sft
        ckpt_prefix: null
      # code-as-a-reward v2 fleet (per-clip LLM-generated reward fns).
      - name: code_v2_main
        ckpt_prefix: "alpamayo_rl/checkpoints/code_reward_clipgen_v2/20260817200928"
        step: 447
      - name: code_v2_shufctl
        ckpt_prefix: "alpamayo_rl/checkpoints/code_reward_clipgen_shufctl_v2/20260817203248"
        step: 447
      - name: code_v2_trace156
        ckpt_prefix: "alpamayo_rl/checkpoints/code_reward_clipgen_trace156_v2/20260817203238"
        step: 447
      # code-as-a-reward full corpus (463 fns / 456 clips), final step.
      - name: code_full1050
        ckpt_prefix: "alpamayo_rl/checkpoints/code_reward_clipgen_full1050/20260824101923"
        step: 720
      # llm-judge gpt-4o baseline run (7bgtj3).
      - name: llm_judge
        ckpt_prefix: "alpamayo_rl/checkpoints/llm_judge_full/20260806192031"
        step: 253
      # consistency reward relaunch 1tbgsl -- still training at config time;
      # wait up to 2.5 h for its final step_253 save, else use max available.
      - name: consistency
        ckpt_prefix: "alpamayo_rl/checkpoints/consistency_full/20260826193536"
        step: 253
        wait_max_min: 150

  experiment_tracker:
    wandb:
      entity: research
      project: alpamayo-track1-submissions

cluster_resources:
  gpu_machine_type: a100.8
  num_gpus: 8
  customer_resource: research
  # Resume-safe (per-event JSONL synced to S3 + converted exports rebuilt
  # idempotently), but a requeue still re-pays ~1 h of downloads/conversions;
  # expected wall clock is only ~3-4 h, so hold the node.
  preemptible: never
  requeue_if_preempted: true
  allowed_regions:
    - us-chicago-1

runtime_environment:
  setup_timeout_seconds: 7200

  required_environment_variables:
    - HF_TOKEN

  constant_environment_variables:
    AWS_REQUEST_CHECKSUM_CALCULATION: when_required
    AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    AWS_ENDPOINT_URL_S3: "https://idskhu5vqvtl.compat.objectstorage.us-chicago-1.oraclecloud.com"
    AWS_DEFAULT_REGION: us-chicago-1

  code_assets:
    root_directory: .
    pip_requirements_path: code_as_a_reward/ood_eval/requirements.txt
    regex_excludes:
      - "^/mnist/"
      - "^/research-core/"
      - "^/docker/"
      - "^/lockfiles/"
      - "^/build_wds/"
      - "^/masking/"
      - "^/pref_pairs/results/"
      - "^/autovla/"
      - "^/perplexity/"
      - "^/simlingo/"
      - "/\\.venv/"
      - "^/jspace/"
      - "^/\\.git/"
