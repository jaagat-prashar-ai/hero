        - data_module.num_workers=8
        - data_module.base_dataset.use_safety_flag=false
        - data_module.base_dataset.dreamer_contrastive=true
        - data_module.base_dataset.dreamer_contrastive_k=4
        - model.language_model.gradient_checkpointing=true
